# Azure DevOps Pipeline Template

Example pipeline for deploying Terraform infrastructure in customer repositories.

## Pipeline File Location

Place this file in your customer repository:
```
.azure-pipelines/terraform-deploy.yml
```

## Complete Pipeline Example

```yaml
# Terraform Deployment Pipeline
# This pipeline validates, plans, and applies Terraform configurations

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - deployments/**
      - modules/**
      - .azure-pipelines/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - deployments/**
      - modules/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: $(customerName)-$(environmentName)-vars  # Variable group from Library
  - name: terraformVersion
    value: '1.5.0'
  - name: deploymentPath
    value: 'deployments/$(customerName)-$(location)-$(environmentName)'

stages:
  #########################################
  # Stage 1: Terraform Validation
  #########################################
  - stage: Validate
    displayName: 'Validate Terraform'
    jobs:
      - job: TerraformValidate
        displayName: 'Validate & Format Check'
        steps:
          - checkout: self
            displayName: 'Checkout Repository'

          - task: TerraformInstaller@0
            displayName: 'Install Terraform $(terraformVersion)'
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(deploymentPath)'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: '$(tfStateResourceGroup)'
              backendAzureRmStorageAccountName: '$(tfStateStorageAccount)'
              backendAzureRmContainerName: '$(tfStateContainerName)'
              backendAzureRmKey: '$(tfStateKey)'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Format Check'
            inputs:
              provider: 'azurerm'
              command: 'custom'
              workingDirectory: '$(deploymentPath)'
              customCommand: 'fmt'
              commandOptions: '-check -recursive'
            continueOnError: true

          - task: TerraformTaskV4@4
            displayName: 'Terraform Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(deploymentPath)'

  #########################################
  # Stage 2: Security Scanning
  #########################################
  - stage: SecurityScan
    displayName: 'Security Scanning'
    dependsOn: Validate
    jobs:
      - job: TFSecScan
        displayName: 'Run tfsec Security Scan'
        steps:
          - checkout: self

          - script: |
              # Install tfsec
              curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
              
              # Run tfsec scan
              tfsec $(deploymentPath) --format=junit > tfsec-results.xml
            displayName: 'Run tfsec'
            continueOnError: true

          - task: PublishTestResults@2
            displayName: 'Publish tfsec Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'tfsec-results.xml'
              testRunTitle: 'tfsec Security Scan'
            condition: always()

  #########################################
  # Stage 3: Terraform Plan
  #########################################
  - stage: Plan
    displayName: 'Terraform Plan'
    dependsOn: 
      - Validate
      - SecurityScan
    jobs:
      - job: TerraformPlan
        displayName: 'Generate Execution Plan'
        steps:
          - checkout: self

          - task: TerraformInstaller@0
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(deploymentPath)'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: '$(tfStateResourceGroup)'
              backendAzureRmStorageAccountName: '$(tfStateStorageAccount)'
              backendAzureRmContainerName: '$(tfStateContainerName)'
              backendAzureRmKey: '$(tfStateKey)'

          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan'
            name: terraformPlan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(deploymentPath)'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: '-out=tfplan -detailed-exitcode'
            continueOnError: true

          - script: |
              cd $(deploymentPath)
              terraform show -json tfplan > tfplan.json
            displayName: 'Convert Plan to JSON'
            condition: succeeded()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Plan Artifact'
            inputs:
              targetPath: '$(deploymentPath)/tfplan'
              artifact: 'tfplan'
            condition: and(succeeded(), ne(variables['terraformPlan.exitCode'], '0'))

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Plan JSON'
            inputs:
              targetPath: '$(deploymentPath)/tfplan.json'
              artifact: 'tfplan-json'
            condition: succeeded()

  #########################################
  # Stage 4: Manual Approval (Production)
  #########################################
  - stage: ApprovalGate
    displayName: 'Approval Gate'
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['environmentName'], 'prod'))
    jobs:
      - job: WaitForApproval
        displayName: 'Wait for Manual Approval'
        pool: server
        steps:
          - task: ManualValidation@0
            displayName: 'Review Plan and Approve'
            inputs:
              notifyUsers: '$(approverEmail)'
              instructions: 'Please review the Terraform plan and approve to continue with deployment.'
              onTimeout: 'reject'

  #########################################
  # Stage 5: Terraform Apply
  #########################################
  - stage: Apply
    displayName: 'Terraform Apply'
    dependsOn: 
      - Plan
      - ApprovalGate
    condition: |
      and(
        succeeded('Plan'),
        or(
          succeeded('ApprovalGate'),
          eq(variables['environmentName'], 'dev')
        ),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    jobs:
      - deployment: TerraformApply
        displayName: 'Apply Infrastructure Changes'
        environment: '$(customerName)-$(environmentName)'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@0
                  displayName: 'Install Terraform'
                  inputs:
                    terraformVersion: '$(terraformVersion)'

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Init'
                  inputs:
                    provider: 'azurerm'
                    command: 'init'
                    workingDirectory: '$(deploymentPath)'
                    backendServiceArm: '$(azureServiceConnection)'
                    backendAzureRmResourceGroupName: '$(tfStateResourceGroup)'
                    backendAzureRmStorageAccountName: '$(tfStateStorageAccount)'
                    backendAzureRmContainerName: '$(tfStateContainerName)'
                    backendAzureRmKey: '$(tfStateKey)'

                - task: DownloadPipelineArtifact@2
                  displayName: 'Download Plan Artifact'
                  inputs:
                    artifact: 'tfplan'
                    path: '$(deploymentPath)'

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Apply'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    workingDirectory: '$(deploymentPath)'
                    environmentServiceNameAzureRM: '$(azureServiceConnection)'
                    commandOptions: 'tfplan'

                - task: TerraformTaskV4@4
                  displayName: 'Terraform Output'
                  inputs:
                    provider: 'azurerm'
                    command: 'output'
                    workingDirectory: '$(deploymentPath)'
                    environmentServiceNameAzureRM: '$(azureServiceConnection)'
                    commandOptions: '-json > terraform-outputs.json'

                - task: PublishPipelineArtifact@1
                  displayName: 'Publish Outputs'
                  inputs:
                    targetPath: '$(deploymentPath)/terraform-outputs.json'
                    artifact: 'terraform-outputs'

  #########################################
  # Stage 6: Post-Deployment Tests
  #########################################
  - stage: PostDeploymentTests
    displayName: 'Post-Deployment Validation'
    dependsOn: Apply
    condition: succeeded()
    jobs:
      - job: ValidationTests
        displayName: 'Run Validation Tests'
        steps:
          - checkout: self

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Outputs'
            inputs:
              artifact: 'terraform-outputs'
              path: '$(System.DefaultWorkingDirectory)'

          - script: |
              # Example: Test resource availability
              echo "Running post-deployment validation..."
              
              # Parse outputs and test connectivity
              # Add your custom validation scripts here
              
              echo "Validation completed successfully"
            displayName: 'Validate Deployment'
```

## Variable Group Configuration

Create in Azure DevOps Library with these variables:

```yaml
# Library > Variable Groups > {customer}-{environment}-vars

# Azure Configuration
azureServiceConnection: azure-{customer}-{env}
subscription_id: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx

# Customer Details
customerName: contoso
customerShortName: contoso
environmentName: prod
location: eastus
locationCode: eus

# Terraform State
tfStateResourceGroup: rg-terraform-state-contoso
tfStateStorageAccount: stterraformcontoso001
tfStateContainerName: tfstate
tfStateKey: contoso-eastus-prod.tfstate

# Approvers (for production)
approverEmail: ops-team@company.com
```

## Usage Instructions

### 1. Create Pipeline in Azure DevOps

1. Go to **Pipelines** > **New Pipeline**
2. Select **Azure Repos Git** (or your repo type)
3. Select your customer repository
4. Choose **Existing Azure Pipelines YAML file**
5. Select `.azure-pipelines/terraform-deploy.yml`
6. **Save** (don't run yet)

### 2. Configure Pipeline Variables

1. Edit the pipeline
2. Click **Variables** button
3. Add pipeline-specific variables:
   - `customerName`: contoso
   - `environmentName`: prod
   - `location`: eastus
4. Link to Variable Group from Library

### 3. Create Environments

1. Go to **Pipelines** > **Environments**
2. Create: `{customer}-dev`
3. Create: `{customer}-staging`
4. Create: `{customer}-prod`
5. Add approvers to prod environment

### 4. Run Pipeline

Trigger options:
- **Manual**: Click "Run pipeline"
- **Automatic**: Push to `main` branch
- **Pull Request**: Opens PR validation

## Multi-Environment Pipeline

For multiple environments in one pipeline:

```yaml
# Add parameters at top of pipeline
parameters:
  - name: environment
    displayName: 'Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - staging
      - prod
  - name: action
    displayName: 'Terraform Action'
    type: string
    default: 'plan'
    values:
      - plan
      - apply
      - destroy

# Use in variables
variables:
  - name: deploymentPath
    value: 'deployments/$(customerName)-$(location)-${{ parameters.environment }}'
```

## Branch Protection

Configure branch policies on `main`:

1. **Require pull request reviews**: At least 1 reviewer
2. **Require status checks**: 
   - Terraform Validate
   - Terraform Plan
3. **Require branches to be up to date**
4. **Include administrators** in restrictions

## Pipeline Outputs

The pipeline produces:
- ✅ Terraform plan file (artifact)
- ✅ Terraform plan JSON (for review)
- ✅ Terraform outputs JSON (post-deployment)
- ✅ Security scan results
- ✅ Validation test results

## Troubleshooting

### Pipeline Fails at Init

**Issue**: Backend configuration not found

**Solution**:
- Verify Variable Group is linked
- Check storage account exists
- Verify service principal has Storage Blob Data Contributor role

### Plan Shows Unexpected Changes

**Issue**: State drift detected

**Solution**:
- Review manual changes in Azure Portal
- Run `terraform refresh` locally
- Consider importing manually created resources

### Apply Fails with Timeout

**Issue**: Long-running resource creation

**Solution**:
- Increase pipeline timeout (default: 60 min)
- Check Azure quotas and limits
- Review resource dependencies

## Best Practices

✅ **Always run plan before apply**
✅ **Use manual approval gates for production**
✅ **Store state remotely in Azure Storage**
✅ **Enable diagnostic logging**
✅ **Run security scans (tfsec, checkov)**
✅ **Use separate service principals per environment**
✅ **Tag all resources with deployment metadata**
✅ **Archive plan files as artifacts**
✅ **Test in dev before promoting to prod**
✅ **Use pipeline templates for consistency**

## Advanced: Pipeline Templates

Create reusable templates:

```
.azure-pipelines/
├── terraform-deploy.yml          # Main pipeline
├── templates/
│   ├── terraform-init.yml        # Reusable init steps
│   ├── terraform-plan.yml        # Reusable plan steps
│   └── terraform-apply.yml       # Reusable apply steps
```

Reference in main pipeline:
```yaml
- template: templates/terraform-init.yml
  parameters:
    workingDirectory: '$(deploymentPath)'
```

This provides consistency across multiple customer pipelines.
